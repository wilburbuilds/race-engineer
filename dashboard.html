<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Engineer</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #12161e; --panel-2: #181d27; --line: #262d3a; --line-soft: #1c222d;
    --text: #edeff3; --muted: #8a93a5; --dim: #5c6577;
    --ref: #57c7f5; --cmp: #ff9f43; --purple: #b15cff; --green: #37d67a; --red: #ff4a4a; --yellow: #ffd447;
    --throttle: #37d67a; --brake: #ff4a4a; --steer: #d9b8ff;
    --font-num: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --font: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ref); outline-offset: 2px; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }

  /* top bar */
  #top { flex: 0 0 auto; display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--panel); }
  #brand { padding: 10px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; min-width: 190px; }
  #brand .title { font-family: var(--font-num); font-size: 20px; font-weight: 600; letter-spacing: 0.04em; line-height: 1; }
  #brand .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #sessline { display: flex; align-items: center; gap: 22px; padding: 0 18px; flex: 1; color: var(--muted); }
  #sessline b { color: var(--text); font-weight: 600; }
  #conn { display: flex; align-items: center; gap: 8px; padding: 0 18px; border-left: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #pick { display: flex; align-items: center; padding: 0 12px; border-left: 1px solid var(--line); }
  #pick select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); padding: 6px 8px; font: inherit; font-size: 13px; max-width: 340px; }
  #conn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  #conn.on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #conn.stale .dot { background: var(--yellow); }

  /* tabs */
  #tabs { overflow-x: auto; }
  #tabs button { white-space: nowrap; }
  .compare-note { color: var(--muted); margin: 12px 0; line-height: 1.5; }
  .compare-table td, .compare-table th { padding: 11px 12px; }
  .compare-table th { text-align: left; }
  .compare-table td:nth-child(2) { color: var(--ref); }
  .compare-table td:nth-child(3) { color: var(--cmp); }
  .compare-table .section td { color: var(--muted); background: var(--panel-2); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .compare-scroll { overflow-x: auto; }

  #tabs { flex: 0 0 auto; display: flex; border-bottom: 1px solid var(--line); background: var(--panel); padding: 0 8px; }
  #tabs button { padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; font-family: var(--font-num); font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
  #tabs button:hover { color: var(--text); }
  #tabs button.active { color: var(--text); border-bottom-color: var(--ref); }

  /* layout */
  #layout { flex: 1 1 auto; display: flex; min-height: 0; }
  #tower { flex: 0 0 330px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #tower .head { display: grid; grid-template-columns: 34px 1fr 62px 62px 62px 30px; gap: 4px; padding: 8px 10px 6px; color: var(--dim); font-size: 11px; border-bottom: 1px solid var(--line-soft); }
  #tower .rows { overflow-y: auto; flex: 1; }
  #tower .sep { padding: 10px 10px 4px; color: var(--dim); font-size: 11px; border-bottom: 1px solid var(--line-soft); }
  .laprow { display: grid; grid-template-columns: 34px 1fr 62px 62px 62px 30px; gap: 4px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); cursor: pointer; font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; }
  .laprow:hover { background: var(--panel-2); }
  .laprow .n { color: var(--muted); }
  .laprow .t { font-weight: 600; }
  .laprow .s { color: var(--muted); font-size: 14px; }
  .laprow .s.purple { color: var(--purple); }
  .laprow .s.green { color: var(--green); }
  .laprow.invalid .t { color: var(--dim); text-decoration: line-through; }
  .laprow.live .t { color: var(--yellow); }
  .laprow .vs { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; text-align: center; }
  .laprow .vs:hover { color: var(--cmp); border-color: var(--cmp); }
  .laprow.ref { box-shadow: inset 3px 0 0 var(--ref); }
  .laprow.cmp { box-shadow: inset 3px 0 0 var(--cmp); }
  .laprow.ref.cmp { box-shadow: inset 3px 0 0 var(--ref), inset 6px 0 0 var(--cmp); }
  #tower .legend { padding: 8px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 14px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

  #content { flex: 1 1 auto; overflow: auto; padding: 16px 20px 70px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; font-size: 15px; }
  .empty b { color: var(--text); }

  /* tiles */
  .grid { display: grid; gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line-soft); padding: 12px 14px; }
  .tile .lbl { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .tile .val { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .tile .val small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .tile .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hero { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .hero .big .val { font-size: 64px; }
  .sectors { display: flex; gap: 8px; margin-top: 8px; }
  .sector { flex: 1; padding: 6px 8px; border: 1px solid var(--line); font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums; }
  .sector .lbl { font-size: 11px; color: var(--muted); }
  .sector.purple { border-color: var(--purple); color: var(--purple); }
  .sector.green { border-color: var(--green); color: var(--green); }
  .sector.yellow { border-color: var(--yellow); color: var(--yellow); }
  .pos { color: var(--green); } .neg { color: var(--red); }

  .car4 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .wheel { padding: 8px; background: var(--panel-2); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .wheel .w { font-size: 11px; color: var(--muted); }
  .wheel .v { font-size: 22px; font-weight: 600; }
  .wheel .v small { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; background: var(--line); margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--ref); }

  /* charts */
  .chart { background: var(--panel); border: 1px solid var(--line-soft); margin-bottom: 10px; }
  .chart .head { display: flex; align-items: baseline; gap: 16px; padding: 8px 12px 0; }
  .chart .head .name { font-family: var(--font-num); font-size: 15px; letter-spacing: 0.03em; }
  .chart .head .read { color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 14px; }
  .chart .head .read b { font-weight: 600; }
  .chart canvas { display: block; width: 100%; }
  #scrub { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 14px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  #scrub input[type=range] { flex: 1; accent-color: var(--ref); }
  #scrub .d { min-width: 90px; color: var(--muted); }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--muted); flex-wrap: wrap; }
  .toolbar select, .toolbar input { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); padding: 5px 8px; font: inherit; }
  .chip { padding: 3px 8px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .chip.ref { border-color: var(--ref); color: var(--ref); } .chip.cmp { border-color: var(--cmp); color: var(--cmp); }
  button.chip:hover { border-color: var(--ref); color: var(--ref); }

  table { border-collapse: collapse; width: 100%; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; }
  th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); font-family: var(--font); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  tr.sel td { background: var(--panel-2); }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  td.purple { color: var(--purple); } td.green { color: var(--green); } td.red { color: var(--red); } td.muted { color: var(--muted); }
  .mapwrap { background: var(--panel); border: 1px solid var(--line-soft); padding: 10px 12px 12px; margin-bottom: 12px; }
  .mapwrap .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .mapwrap .head .name { font-family: var(--font-num); font-size: 15px; letter-spacing: 0.03em; }
  .mapwrap .head .hint { color: var(--dim); font-size: 12px; }
  .maprow { display: grid; grid-template-columns: minmax(320px, 1.15fr) 1fr; gap: 14px; align-items: start; }
  #trackmap { display: block; width: 100%; cursor: pointer; }
  .cornerinfo { border-left: 1px solid var(--line-soft); padding-left: 14px; }
  .cornerinfo h3 { font-family: var(--font-num); font-size: 20px; margin: 0 0 2px; letter-spacing: 0.02em; }
  .cornerinfo .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .cornerinfo table { font-size: 14px; }
  .cornerinfo td, .cornerinfo th { padding: 5px 6px; }
  .best { color: var(--purple); }
  .rename { color: var(--dim); margin-left: 8px; font-size: 12px; opacity: 0; }
  tr:hover .rename { opacity: 1; }
  .rename:hover { color: var(--ref); }
  input.cname { background: var(--panel-2); color: var(--text); border: 1px solid var(--ref); padding: 3px 6px; font: inherit; font-family: var(--font); font-size: 14px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  h2 { font-family: var(--font-num); font-size: 17px; font-weight: 600; letter-spacing: 0.03em; margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .events { list-style: none; margin: 0; padding: 0; color: var(--muted); }
  .events li { padding: 4px 0; border-bottom: 1px solid var(--line-soft); }
  .events li .num { color: var(--dim); margin-right: 10px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .coach-card {background:var(--panel);border:1px solid var(--line-soft);padding:18px 22px;margin-bottom:14px;max-width:1000px;}
  .coach-card p {line-height:1.6;max-width:85ch;margin:8px 0;}
  .coach-card h3 {font-size:14px;margin:16px 0 4px;color:var(--muted);}
  .coach-next {border-left:4px solid var(--ref);}
  .coach-next > p:first-of-type {font-size:19px;}
  .coach-card summary {cursor:pointer;font-weight:600;}
  button:disabled {opacity:.45;cursor:default;}
/* Shared visual hierarchy: restrained surfaces, numeric emphasis, clear interaction states. */
:root { --bg:#0d1118; --panel:#151b25; --panel-2:#1b2431; --line:#303c4d; --line-soft:#253040; --text:#f0f4f9; --muted:#a1afc2; --dim:#8290a5; --font-num:"Avenir Next","Helvetica Neue",sans-serif; }
html,body {font-size:13px;}
#top {min-height:64px;background:#101620;}
#brand {min-width:170px;padding:14px 22px;border:0;}
#brand .title {font-family:var(--font);font-size:15px;font-weight:750;letter-spacing:.045em;}
#brand .sub {font-size:11px;color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#sessline {gap:12px;padding:0 14px;font-size:12px;flex-wrap:wrap;}
#sessline b {font-size:17px;}
#conn {font-size:11px;white-space:nowrap;border:0;}
#conn.on .dot {box-shadow:none;}
#pick {border:0;}
#pick select {border-radius:7px;padding:8px 10px;max-width:300px;}
#tabs {align-items:center;padding:8px 16px;gap:3px;background:#101620;min-height:55px;}
#tabs button {display:flex;gap:7px;align-items:center;font-family:var(--font);font-size:12px;font-weight:550;text-transform:none;letter-spacing:0;padding:9px 11px;border:0;border-radius:7px;}
#tabs button.active {background:#223447;color:var(--ref);border:0;}
#tabs .nav-group {display:flex;align-items:center;gap:2px;}
#tabs .nav-group+.nav-group {margin-left:8px;padding-left:10px;border-left:1px solid var(--line);}
#tabs .nav-label {font-size:10px;color:var(--dim);margin:0 7px 0 2px;}
.icon {width:18px;height:18px;flex-shrink:0;vertical-align:middle;}
#layout.wide #tower {display:none;}
#tower {flex-basis:300px;background:#101620;}
#tower .head,.laprow {grid-template-columns:28px 1fr 47px 47px 47px 24px;gap:3px;}
#tower .head {color:var(--muted);padding:14px 10px 9px;}
.laprow {padding:9px 10px;font-size:13px;}
.laprow .s {font-size:11px;}
#tower .legend {font-size:10px;gap:10px;}
#content {padding:24px 28px 48px;}
.page-head {display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:18px;}
.page-head h1 {font-size:26px;font-weight:650;letter-spacing:-.035em;margin:0;}
.page-head p {margin:4px 0 0;color:var(--muted);font-size:12px;}
.page-body {max-width:1400px;margin:0 auto;}
.page-head {max-width:1400px;margin-left:auto;margin-right:auto;}
h2 {font-family:var(--font);font-size:16px;letter-spacing:-.02em;line-height:1.35;font-weight:650;}
h3 {font-size:13px;line-height:1.4;font-weight:600;}
p {line-height:1.55;}
.muted {color:var(--muted);}.small {font-size:11px;}.positive {color:var(--green);}.negative {color:var(--red);}
.eyebrow {font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);}
.visual-panel,.tile,.mapwrap,.chart,.setting-group {border:1px solid var(--line-soft);background:var(--panel);border-radius:10px;}
.visual-panel {padding:20px;min-width:0;}
.visual-panel h2 {margin:8px 0;}.visual-panel p {margin:8px 0;}
.panel-head {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.panel-head h2 {margin:0;}.panel-head .muted {font-size:11px;}
.metric-strip {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px;}
.visual-metric {padding:16px 18px;background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;min-width:0;}
.metric-value {font-size:31px;letter-spacing:-.035em;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:5px;}
.metric-detail {font-size:11px;color:var(--muted);margin-top:5px;}
.visual-metric.violet .metric-value {color:var(--purple);}.visual-metric.orange .metric-value {color:var(--cmp);}
.quality-bar {display:flex;gap:3px;height:4px;margin-top:10px;}.quality-bar i {background:var(--line);flex:1;border-radius:2px;}.quality-bar .filled {background:var(--ref);}
.engineer-toolbar {display:flex;justify-content:space-between;align-items:center;margin:-6px 0 16px;}
.badge {display:inline-flex;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:5px;font-size:10px;font-weight:600;color:var(--muted);line-height:1.25;}
.badge.positive {color:#84deac;background:#17362a;border-color:#275341;}.badge.caution {color:#e8c48b;background:#30271c;border-color:#4b3c27;}
.button {display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:6px;border:1px solid var(--line);padding:9px 13px;font-size:12px;font-weight:600;}
.button.primary {background:var(--ref);border-color:var(--ref);color:#0b1a24;}.button.secondary {background:var(--panel-2);color:var(--text);}.button.quiet {color:var(--muted);border-color:transparent;}
.button:hover {filter:brightness(1.13);}.button:disabled {filter:none;}
.chip {border-radius:5px;padding:6px 10px;}.chip.active {color:var(--ref);border-color:#4b8dac;background:#1c3445;}
.coach-grid {display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;margin-bottom:18px;}
.action-panel {display:flex;flex-direction:column;align-items:flex-start;}
.action-title {font-size:28px!important;letter-spacing:-.035em;max-width:24ch;margin-top:13px!important;}
.action-panel>p {max-width:60ch;font-size:13px;}
.confidence-row {display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:18px;font-size:11px;}
.condition-tags {display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.condition-tags .badge {font-size:9px;font-weight:500;}
.teaching-cue {display:flex;align-items:center;gap:22px;margin:19px 0 7px;}
.cue {display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--ref);}
.cue:first-child {color:#ff9292;}.cue:nth-child(2) {color:#b2bdd0;}
.cue svg {width:38px;height:43px;}.cue span {color:var(--text);}
.focus-track {width:100%;height:155px;display:block;margin:10px auto 4px;}
.focus-numbers {display:grid;grid-template-columns:1fr 1.2fr;gap:12px;margin:6px 0 14px;}
.focus-numbers .visual-metric {padding:0;border:0;background:none;}
.focus-numbers .metric-value {font-size:24px;}.focus-numbers .metric-detail {font-size:10px;}
.focus-panel>.button {width:100%;}
.baseline-dots {display:flex;justify-content:center;gap:14px;padding:32px 0 24px;}
.baseline-dots span {display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px dashed var(--line);border-radius:50%;color:var(--dim);font-weight:600;font-size:18px;}
.baseline-dots .complete {background:#17362a;border:1px solid #275341;color:#84deac;}
.focus-panel>h3,.focus-panel>p {text-align:center;}
.onboarding {text-align:center;padding:50px;}.onboarding>.icon {height:40px;width:40px;color:var(--ref);margin-bottom:12px;}
.feedback-panel {display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px;}
.feedback-panel h2 {margin:0;}.feedback-options {display:flex;gap:8px;flex-wrap:wrap;}
.feedback-option {display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:11px 16px;font-size:12px;}
.feedback-option.active {background:#20384a;border-color:var(--ref);color:var(--ref);}
.setup-change {display:flex;gap:15px;align-items:center;margin-top:14px;flex-wrap:wrap;}.setup-change>span {font-size:12px;color:var(--muted);}.setup-change>b {font-size:31px;font-variant-numeric:tabular-nums;}.setup-change .proposed {color:var(--ref);}
.practice-steps {display:grid;grid-template-columns:repeat(4,1fr);width:100%;gap:12px;margin:18px 0;}
.practice-step {display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:10px;color:var(--dim);font-size:10px;}.practice-step .icon {width:16px;height:16px;}.practice-step.done {border-color:var(--green);color:var(--green);}.practice-step b {color:var(--text);font-size:11px;}.practice-step span {color:var(--muted);}
.test-verdict {border-top:1px solid var(--line);margin:10px 0;padding-top:12px;font-size:12px;display:flex;gap:15px;align-items:center;}.test-verdict b {font-size:26px;white-space:nowrap;}
.lap-timeline {margin-bottom:18px;padding:18px 20px;}
.chart-key {display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted);}
.chart-key>span {display:flex;gap:6px;align-items:center;}.chart-key i {width:10px;height:10px;display:inline-block;border-radius:2px;background:var(--ref);}.chart-key i.excluded {background:#465367;}.chart-key i.pit {background:#b090d7;}
.lap-rail {display:flex;align-items:flex-end;gap:5px;padding:18px 0 0;overflow-x:auto;min-height:112px;}
.rhythm-lap {flex:1;min-width:23px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 2px 6px;}
.rhythm-bar {display:block;width:100%;max-width:32px;border-radius:4px 4px 0 0;background:var(--ref);opacity:.8;}.rhythm-lap.excluded .rhythm-bar {background:repeating-linear-gradient(135deg,#465367 0,#465367 3px,#354153 3px,#354153 6px);}.rhythm-lap.pit .rhythm-bar {background:#b090d7;}
.rhythm-lap.selected .rhythm-bar,.rhythm-lap:hover .rhythm-bar {opacity:1;box-shadow:0 0 0 2px var(--text);}.lap-number {font-variant-numeric:tabular-nums;color:var(--muted);font-size:10px;}

<body>
<header id="top">
  <div id="brand"><div class="title">RACE ENGINEER</div><div class="sub" id="brandsub">waiting for the game</div></div>
  <div id="sessline"></div>
  <div id="pick"><select id="sesspick" title="open a saved session"><option value="">Live</option></select></div>
  <div id="conn"><span class="dot"></span><span id="conntext">connecting</span></div>
</header>
<nav id="tabs"></nav>
<div id="layout">
  <aside id="tower">
    <div class="head"><span>Lap</span><span>Time</span><span>S1</span><span>S2</span><span>S3</span><span></span></div>
    <div class="rows" id="towerrows"></div>
    <div class="legend"><span><i class="sw" style="background:var(--ref)"></i>reference</span><span><i class="sw" style="background:var(--cmp)"></i>compare</span><span><i class="sw" style="background:var(--purple)"></i>best sector</span></div>
  </aside>
  <main id="content"></main>
</div>

<script>
'use strict';
// ============================================================================ state
const S = {
  live: null, laps: [], currentLap: 0, traceLaps: [], session: null,
  traces: new Map(),          // lap number -> Trace
  ref: null, cmp: null,       // selected lap numbers (ref = A, cmp = B)
  autoRef: true,              // follow the best lap until the user picks one
  cursor: null,               // distance (m) of the cursor / scrubber
  tab: 'engineer', opponent: null, comparisonSession: null, corner: 0, cornerList: [],
  lastRender: 0, liveDirty: true, dataDirty: true, lastTraceFetch: 0, lapsKey: '',
  mode: 'live', savedId: '', sessions: [],
  cornerNames: [], cornerPreset: [], cornerShift: 0, hasPreset: false, cornerNamesTrack: null, editingCorner: null,
};
const isSaved = () => S.mode === 'saved';
function sessInfo() { return S.session; }                                   // session.json style info (live or saved)
function liveSess() { return isSaved() ? null : (S.live?.session || null); }
const TABS = [['engineer', 'Engineer'], ['live', 'Live'], ['compare', 'You vs others'], ['laps', 'Laps'], ['speed', 'Speed'], ['steer', 'Steering & gear'], ['tyres', 'Tyres'],
              ['brakes', 'Brakes & ERS'], ['corner', 'Corners'], ['session', 'Session']];
// Column layouts live on each Trace (sessions recorded by older versions have fewer columns).

// ============================================================================ helpers
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function fmtLap(ms) { if (!ms || ms <= 0) return '--'; ms = Math.round(ms); const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), t = ms % 1000; return m ? `${m}:${String(s).padStart(2, '0')}.${String(t).padStart(3, '0')}` : `${s}.${String(t).padStart(3, '0')}`; }
function fmtDelta(ms, digits = 3) { if (ms == null || isNaN(ms)) return '--'; const s = ms / 1000; return (s >= 0 ? '+' : '−') + Math.abs(s).toFixed(digits); }
function fmtGap(ms) { return ms == null ? '--' : (ms / 1000).toFixed(1) + 's'; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function speedUnit() { return (isSaved() ? S.session?.speed_units : S.live?.session?.speed_units) || 'kph'; }
function tempUnit() { return (isSaved() ? S.session?.temp_units : S.live?.session?.temp_units) || 'C'; }
function temp(c) { return (c == null || isNaN(c)) ? '--' : (tempUnit() === 'F' ? Math.round(c * 9 / 5 + 32) : Math.round(c)); }
function speedCol() { return speedUnit() === 'mph' ? 'speed_mph' : 'speed_kph'; }
function distUnitLabel() { return 'm'; }

// ============================================================================ traces
class Trace {
  constructor(lap) { this.lap = lap; this.rows = []; this.next = 0; this.complete = false; this.fetching = false; this.loaded = false; this.cache = {}; this.C = null; }
  setColumns(cols) { if (!this.C && cols) { this.C = {}; cols.forEach((c, i) => this.C[c] = i); } }
  has(name) { return !!(this.C && name in this.C); }
  ingest(resp) {
    if (resp.from !== this.next) return;
    this.setColumns(resp.columns);
    const di = this.C ? this.C.distance_m : 3;
    for (const r of resp.rows) { const d = r[di]; if (d < 0) continue; const last = this.rows.length ? this.rows[this.rows.length - 1][di] : -1; if (d < last - 50) this.rows = []; this.rows.push(r); }
    this.next = resp.next; this.complete = resp.complete; this.loaded = true;
    if (resp.rows.length) this.cache = {};
  }
  col(name) { if (!this.cache[name]) { const i = this.C ? this.C[name] : undefined; this.cache[name] = i == null ? this.rows.map(() => null) : this.rows.map(r => r[i]); } return this.cache[name]; }
  get dist() { return this.col('distance_m'); }
  get time() { return this.col('lap_time_ms'); }
  get length() { return this.rows.length ? this.dist[this.rows.length - 1] : 0; }
  get lapTime() { const l = S.laps.find(x => x.lap === this.lap); return l ? l.time_ms : (this.rows.length ? this.time[this.rows.length - 1] : 0); }
  // index of the last sample with distance <= d
  idx(d) { const a = this.dist; let lo = 0, hi = a.length - 1; if (!a.length || d <= a[0]) return 0; if (d >= a[hi]) return hi; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m] <= d) lo = m; else hi = m; } return lo; }
  at(colIdx, d) { const a = this.dist, y = this.col(colIdx); if (!a.length) return null; const i = this.idx(d); if (i >= a.length - 1) return y[a.length - 1]; const d0 = a[i], d1 = a[i + 1]; if (d1 === d0) return y[i]; const f = clamp((d - d0) / (d1 - d0), 0, 1); return y[i] + (y[i + 1] - y[i]) * f; }
  timeAt(d) { return this.at('lap_time_ms', d); }
}
async function fetchTrace(lap) {
  let t = S.traces.get(lap);
  if (!t) { t = new Trace(lap); S.traces.set(lap, t); }
  if (t.fetching || (t.complete && t.loaded)) return;
  t.fetching = true;
  try {
    const r = await fetch(`/api/trace?lap=${lap}&from=${t.next}${isSaved() ? '&session=' + encodeURIComponent(S.savedId) : ''}`);
    const j = await r.json();
    if (j.error) { t.error = j.error; t.loaded = true; S.dataDirty = true; }
    else { t.error = null; t.ingest(j); S.dataDirty = true; }
  } catch (e) { t.error = String(e); t.loaded = true; S.dataDirty = true; }
  t.fetching = false;
}
function trace(lap) { return lap != null ? S.traces.get(lap) : null; }
function movingAvg(a, w) { const out = new Array(a.length); let sum = 0; const q = []; for (let i = 0; i < a.length; i++) { q.push(a[i]); sum += a[i]; if (q.length > w) sum -= q.shift(); out[i] = sum / q.length; } return out; }

// corners are found on the reference lap: local minima of speed with some prominence, then a braking-entry and throttle-exit boundary
function detectCorners(t) {
  if (!t || t.rows.length < 50 || !t.has('speed_kph')) return [];
  const d = t.dist, v = movingAvg(t.col('speed_kph'), 5), brk = t.col('brake'), thr = t.col('throttle'), gear = t.col('gear');
  const mins = [];
  const W = 12;
  for (let i = W; i < v.length - W; i++) {
    let isMin = true;
    for (let k = i - W; k <= i + W; k++) if (v[k] < v[i]) { isMin = false; break; }
    if (!isMin) continue;
    let before = v[i], after = v[i];
    for (let k = Math.max(0, i - 60); k < i; k++) before = Math.max(before, v[k]);
    for (let k = i; k < Math.min(v.length, i + 60); k++) after = Math.max(after, v[k]);
    if (Math.min(before, after) - v[i] < 15) continue;
    if (v[i] < 15) continue;   // a stop (spin, crash, pit box) is not a corner
    if (mins.length && d[i] - d[mins[mins.length - 1]] < 110) { if (v[i] < v[mins[mins.length - 1]]) mins[mins.length - 1] = i; continue; }
    mins.push(i);
  }
  return mins.map((i, n) => {
    let j = i; while (j > 0 && d[i] - d[j] < 420 && !(brk[j] < 0.05 && thr[j] > 0.5)) j--;
    let k = i; while (k < v.length - 1 && d[k] - d[i] < 350 && thr[k] < 0.95) k++;
    return { n: n + 1, name: 'T' + (n + 1), apex: d[i], entry: Math.max(0, d[j] - 30), exit: Math.min(t.length, d[k] + 40), minSpeed: v[i], gear: gear[i] };
  }).filter(c => c.exit > c.entry + 20);
}
function cornerStats(t, c) {
  if (!t || !t.rows.length) return null;
  const i0 = t.idx(c.entry), i1 = t.idx(c.exit);
  const v = t.col('speed_kph'), brk = t.col('brake'), thr = t.col('throttle'), d = t.dist, g = t.col('gear');
  let minV = Infinity, minI = i0, brakeAt = null, fullThrottleAt = null, peakBrake = 0;
  for (let i = i0; i <= i1; i++) { if (v[i] < minV) { minV = v[i]; minI = i; } }
  for (let i = i0; i <= minI; i++) { if (brk[i] > 0.1 && brakeAt == null) brakeAt = d[i]; peakBrake = Math.max(peakBrake, brk[i]); }
  for (let i = minI; i <= i1; i++) { if (thr[i] >= 0.95) { fullThrottleAt = d[i]; break; } }
  const tIn = t.timeAt(c.entry), tOut = t.timeAt(c.exit);
  return { minSpeed: minV, apex: d[minI], brakeAt, fullThrottleAt, peakBrake, gear: g[minI], time: (tOut != null && tIn != null) ? tOut - tIn : null, entrySpeed: v[i0] };
}

// ============================================================================ polling
async function poll() {
  try {
    const r = await fetch('/api/live'); if (r.ok) { S.live = await r.json(); S.liveDirty = true; loadCornerNames(); }
  } catch (e) { S.live = S.live ? Object.assign(S.live, { connected: false }) : null; }
  setTimeout(poll, 500);
}
function applyLaps(laps, currentLap, traceLaps) {
  const key = JSON.stringify([S.mode, S.savedId, currentLap, laps]); if (key !== S.lapsKey) { S.lapsKey = key; S.dataDirty = true; }
  S.laps = laps; S.currentLap = currentLap; S.traceLaps = traceLaps;
  if (S.autoRef) { const best = bestLap(); if (best && best.lap !== S.ref) { S.ref = best.lap; S.cornerList = []; S.dataDirty = true; } }
  if (S.ref == null) { const first = S.currentLap || (S.traceLaps.length ? S.traceLaps[0] : null); if (first != null) { S.ref = first; S.dataDirty = true; } }
  for (const lap of new Set([S.ref, S.cmp, S.currentLap].filter(x => x != null))) fetchTrace(lap);
}
async function pollLaps() {
  if (!isSaved()) {
    try { const r = await fetch('/api/laps'); if (r.ok) { const j = await r.json(); applyLaps(j.laps, j.current_lap, j.trace_laps); } } catch (e) { }
  }
  setTimeout(pollLaps, 600);
}
async function openSaved(id) {
  S.mode = id ? 'saved' : 'live'; S.savedId = id || '';
  S.session = null; S.laps = []; C.report = null; C.key = null;
  S.traces.clear(); S.ref = null; S.cmp = null; S.autoRef = true; S.cornerList = []; S.lapsKey = ''; S.cursor = null;
  renderTop(); renderTower(); renderTab();
  if (id) {
    try {
      const r = await fetch('/api/saved?id=' + encodeURIComponent(id));
      if (r.ok) { const j = await r.json(); if (S.savedId !== id) return; S.session = j.session || {}; S.cornerNamesTrack = null; loadCornerNames(); applyLaps(j.laps || [], 0, j.trace_laps || []); }
    } catch (e) { }
    if (S.tab === 'live') { S.tab = 'laps'; renderTabs(); }
  } else { S.laps = []; S.session = null; }
  S.dataDirty = true; S.liveDirty = true;
}
async function pollSessions() {
  try {
    const r = await fetch('/api/sessions');
    if (r.ok) {
      const j = await r.json(); S.sessions = j.sessions || [];
      const sel = $('#sesspick'); const cur = sel.value;
      sel.innerHTML = '<option value="">Live</option>' + S.sessions.map(x => `<option value="${x.id}">${(x.recorded || x.id).replace('T', ' ').slice(0, 16)} · ${x.track || '?'} · ${x.session_type || ''} · ${x.laps} laps${x.live ? ' · recording' : ''}</option>`).join('');
      sel.value = cur;
      if (sel.value !== cur) sel.value = '';
    }
  } catch (e) { }
  setTimeout(pollSessions, 8000);
}
$('#sesspick').addEventListener('change', e => openSaved(e.target.value));
async function pollSession() {
  if (!isSaved()) { try { const r = await fetch('/api/session'); if (r.ok) { const j = await r.json(); if (isSaved()) return; S.session = j; if (S.tab === 'session') S.dataDirty = true; } } catch (e) { } }
  setTimeout(pollSession, 5000);
}
function trackName() { const s = isSaved() ? S.session : S.live?.session; return s ? (s.track || null) : null; }
async function loadCornerNames() {
  const tr = trackName();
  if (!tr || tr === S.cornerNamesTrack) return;
  S.cornerNamesTrack = tr;
  const s = isSaved() ? S.session : S.live?.session;
  const len = s ? (s.track_length_m || '') : '';
  try {
    const r = await fetch(`/api/corner-names?track=${encodeURIComponent(tr)}&length=${len}`);
    if (r.ok) { const j = await r.json(); if (tr !== trackName()) return; S.cornerNames = j.names || []; S.cornerPreset = j.preset || []; S.hasPreset = !!j.has_preset; S.cornerShift = +(localStorage_get('shift:' + tr) || 0); S.dataDirty = true; }
  } catch (e) { }
}
// tiny persistence for the label shift (in memory + the corner names file would be overkill)
const _shifts = {};
function localStorage_get(k) { return _shifts[k]; }
function localStorage_set(k, v) { _shifts[k] = v; }
async function saveCornerNames() {
  const tr = trackName(); if (!tr) return;

async function pollOverlays() {

    O.pending = true;

      const response = await fetch('/api/opponents?' + suffix);
      if (!response.ok) throw new Error('Could not load recorded opponents.');

      O.catalog = catalog; O.error = catalog.error || '';

      const rivals = catalog.drivers?.filter(d => !d.you) || [];
      const rival = rivals.find(d => d.id === O.driver) || rivals[0];
      if (own && rival) {
        if (O.driver !== rival.id) { O.driver = rival.id; O.rivalLap = null; }
        if (!own.laps.some(l => l.lap === O.ownLap)) O.ownLap = overlayPick(own.laps)?.lap;
        if (!rival.laps.some(l => l.lap === O.rivalLap)) O.rivalLap = overlayPick(rival.laps)?.lap;
        const selection = JSON.stringify([context, O.driver, O.ownLap, O.rivalLap]);
        const key = JSON.stringify([selection, own.name, rival.name, own.laps.find(l=>l.lap===O.ownLap), rival.laps.find(l=>l.lap===O.rivalLap)]);
        const completed = own.laps.find(l => l.lap === O.ownLap)?.finished && rival.laps.find(l => l.lap === O.rivalLap)?.finished;
        if (O.loadedKey !== key || !completed) {
          const [a,b] = await Promise.all([own, rival].map((d,i) => fetch(`/api/opponent-trace?${suffix}&driver=${d.id}&lap=${i ? O.rivalLap : O.ownLap}`).then(r => { if (!r.ok) throw new Error('Could not load lap traces.'); return r.json(); })));
          if (overlayContext() !== context || selection !== JSON.stringify([context,O.driver,O.ownLap,O.rivalLap])) return;

function overlaySelectionChanged() { O.own = O.rival = null; O.loadedKey = ''; S.dataDirty = true; renderTab(); }
function overlayLabel(lap) {

function overlayValue(rows, distance, col) {
  if (!rows?.length || distance < rows[0][0] || distance > rows.at(-1)[0]) return null;
  let lo=0, hi=rows.length-1;
  while (hi-lo>1) { const mid=(lo+hi)>>1; if (rows[mid][0] <= distance) lo=mid; else hi=mid; }
  const a=rows[lo], b=rows[hi];
  if (distance === a[0]) return a[col];
  if (distance === b[0]) return b[col];
  if (b[6]-a[6]>.5 || b[0]-a[0]>100) return null;

  right.appendChild(el('h2', '', 'Setup'));

      ['Suspension front / rear', `${su.frontSuspension} / ${su.rearSuspension}`], ['Anti-roll bar front / rear', `${su.frontAntiRollBar} / ${su.rearAntiRollBar}`],

};

// ============================================================================ tower + top bar
function selectRef(lap) { S.ref = lap; S.autoRef = false; S.cornerList = []; fetchTrace(lap); S.dataDirty = true; renderTower(); renderTab(); }
function selectCmp(lap) { S.cmp = (S.cmp === lap) ? null : lap; if (S.cmp != null) fetchTrace(lap); S.dataDirty = true; renderTower(); renderTab(); }
function renderTower() {
  const rows = $('#towerrows'); rows.innerHTML = '';
  const bs = bestSectors(), best = bestLap();
  const mk = (lap, timeMs, s1, s2, s3, valid, live) => {
    const r = el('div', 'laprow' + (valid ? '' : ' invalid') + (live ? ' live' : '') + (lap === S.ref ? ' ref' : '') + (lap === S.cmp ? ' cmp' : ''));
    r.appendChild(el('span', 'n', live ? '●' : String(lap)));
    r.appendChild(el('span', 't' + (best && lap === best.lap ? ' purple' : ''), live ? fmtLap(timeMs) : fmtLap(timeMs)));
    const sc = (ms, b) => 's' + (ms > 0 && b && ms <= b ? ' purple' : '');
    r.appendChild(el('span', sc(s1, bs[0]), s1 > 0 ? fmtLap(s1) : (live ? '…' : '--')));
    r.appendChild(el('span', sc(s2, bs[1]), s2 > 0 ? fmtLap(s2) : (live && s1 > 0 ? '…' : '--')));
    r.appendChild(el('span', sc(s3, bs[2]), s3 > 0 ? fmtLap(s3) : (live && s2 > 0 ? '…' : '--')));
    const vs = el('button', 'vs', 'vs'); vs.title = 'compare this lap (B)'; vs.addEventListener('click', e => { e.stopPropagation(); selectCmp(lap); }); r.appendChild(vs);
    r.addEventListener('click', () => selectRef(lap));
    rows.appendChild(r);
  };
  const d = isSaved() ? null : S.live?.driver;
  if (d && S.currentLap) mk(S.currentLap, d.current_lap_ms, d.s1_ms, d.s2_ms, 0, !d.current_lap_invalid, true);
  for (const l of S.laps.slice().reverse()) mk(l.lap, l.time_ms, l.s1_ms, l.s2_ms, l.s3_ms, l.valid, false);
  // laps that have trace data but no timed entry (recording started mid-lap, session ended mid-lap, formation lap)
  const known = new Set(S.laps.map(l => l.lap)); if (d && S.currentLap) known.add(S.currentLap);
  const extra = S.traceLaps.filter(n => !known.has(n)).sort((a, b) => b - a);
  if (extra.length) { rows.appendChild(el('div', 'sep', 'trace only · no lap time recorded')); for (const n of extra) mk(n, 0, 0, 0, 0, true, false); }
  if (!S.laps.length && !d && !extra.length) rows.appendChild(el('div', 'empty', isSaved() ? 'This session has no completed laps.' : 'Laps appear here as you complete them.'));
}
function renderTop() {

  else if (L.connected) { conn.className = 'on'; txt.textContent = `live · ${L.packets_per_second} pkt/s`; }
  else { conn.className = 'stale'; txt.textContent = 'no data from the game'; }
  const line = $('#sessline');
  if (isSaved()) { conn.className = ''; txt.textContent = 'Saved recording'; const v = S.session || {}; line.innerHTML = `<span style="color:var(--yellow)">saved session</span><span><b>${v.track || '?'}</b></span><span>${v.session_type || ''}</span><span>${v.weather || ''}${v.track_temp_c != null ? ' · track ' + temp(v.track_temp_c) + '°' + tempUnit() : ''}</span><span>${v.recorded ? v.recorded.replace('T', ' ') : ''}</span>`; $('#brandsub').textContent = 'Saved recording'; return; }
  const s = L.session;

const PAGE_INFO = {
 engineer: ['Your engineer', 'One next action, backed by your laps.'], live: ['Live telemetry', 'Your car and inputs, as they happen.'], laps: ['Lap history', 'See your pace, consistency and tyre changes.'], compare: ['You vs others', 'Find where the time changes.'], speed: ['Speed & inputs', 'Compare braking, throttle and pace along the lap.'], steer: ['Steering & gears', 'See how your inputs change through each corner.'], tyres: ['Tyres', 'Compare all four wheels along the lap.'], brakes: ['Brakes & energy', 'Track braking temperatures and energy use.'], corner: ['Corners', 'Select a section to compare your inputs.'], session: ['Session & setup', 'Conditions, assists and recorded car settings.']
};
function renderTabs() {

  const group = el('div', 'nav-group'); if (label) group.append(el('span', 'nav-label', label));
  for (const id of ids) { const title = TABS.find(t => t[0] === id)[1]; const b = el('button', id === S.tab ? 'active' : ''); b.append(icon(id), document.createTextNode(title)); b.addEventListener('click', () => { S.tab = id; charts.length = 0; renderTab(true); renderTabs(); }); group.append(b); } n.append(group);

function renderTab(force) {

// throttle: full re-render at most ~3 times a second, only when something changed
function tick() {
